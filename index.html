<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fernan Saw Game - Clon Profesional</title>
    <style>
        /* ==========================================================================
           ESTILOS GENERALES (PRO CSS) - Interfaz de Inkagames / Saw
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenedor Principal del Juego (Resolución clásica de juego Flash) */
        #game-container {
            width: 800px;
            height: 600px;
            background-color: #000;
            position: relative;
            border: 4px solid #333;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Pantalla de Inicio / Menu */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
        }

        .screen.active {
            display: flex;
        }

        #menu-screen {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), repeating-linear-gradient(0deg, #111, #111 2px, #1a1a1a 2px, #1a1a1a 4px);
        }

        .title-saw {
            font-size: 48px;
            color: #ff0000;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #000, 0 0 10px rgba(255, 0, 0, 0.8);
            margin-bottom: 5px;
            font-weight: bold;
        }

        .title-fernan {
            font-size: 32px;
            color: #00ff00;
            margin-bottom: 40px;
            font-family: sans-serif;
            font-weight: 900;
            transform: rotate(-3deg);
        }

        .btn-custom {
            padding: 15px 40px;
            font-size: 20px;
            background-color: #aa0000;
            color: white;
            border: 2px solid #ff0000;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #550000;
            transition: all 0.1s ease;
        }

        .btn-custom:hover {
            background-color: #cc0000;
            box-shadow: 0 3px 0 #770000;
            transform: translateY(2px);
        }

        /* Escenario del Juego */
        #game-screen {
            background-color: #2c3e50;
        }

        .room {
            width: 100%;
            height: 480px; /* Espacio para la escena */
            position: relative;
            background-size: cover;
            display: none;
        }

        .room.active {
            display: block;
        }

        /* Habitaciones (Arte CSS Temporal de alta fidelidad) */
        #room1 {
            background: radial-gradient(circle, #555 0%, #222 100%);
            border-bottom: 20px solid #111;
        }

        #room2 {
            background: radial-gradient(circle, #445544 0%, #112211 100%);
            border-bottom: 20px solid #051105;
        }

        /* Elementos Interactivos (Objetos/Personajes) */
        .interactive {
            position: absolute;
            cursor: pointer;
            transition: filter 0.2s;
        }

        .interactive:hover {
            filter: drop-shadow(0 0 8px #00ff00) brightness(1.2);
        }

        /* Sprites / Elementos Visuales */
        #fernan-player {
            width: 100px;
            height: 180px;
            background-color: #00ff00; /* Representación de Fernanfloo con su gorra */
            position: absolute;
            bottom: 20px;
            left: 100px;
            border-radius: 10px;
            border: 3px solid #000;
            transition: left 0.5s ease;
        }
        
        #fernan-player::before {
            content: "¡CARAJO!";
            position: absolute;
            top: -15px;
            left: 15px;
            background: #fff;
            color: #000;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 3px;
            font-weight: bold;
        }

        .item-key {
            width: 40px;
            height: 20px;
            background-color: #ffd700;
            bottom: 30px;
            right: 200px;
            border-radius: 5px;
        }

        .pigsaw {
            width: 80px;
            height: 120px;
            background-color: #ffffff;
            border: 4px solid #ff0000;
            bottom: 40px;
            right: 100px;
            border-radius: 5px;
        }

        /* Flechas de Navegación */
        .arrow {
            position: absolute;
            bottom: 50%;
            width: 50px;
            height: 50px;
            background-color: rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            cursor: pointer;
            border-radius: 50%;
        }
        .arrow:hover { background-color: rgba(255,255,255,0.5); }
        .arrow-right { right: 20px; }
        .arrow-left { left: 20px; }

        /* Barra de Interfaz Inferior (Inventario y Diálogos) */
        #ui-bar {
            width: 100%;
            height: 120px;
            background-color: #151515;
            position: absolute;
            bottom: 0;
            left: 0;
            border-top: 4px solid #333;
            display: flex;
            padding: 10px;
        }

        #inventory-panel {
            width: 300px;
            height: 100%;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
        }

        .inventory-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .inventory-slots {
            display: flex;
            gap: 8px;
        }

        .slot {
            width: 60px;
            height: 60px;
            background-color: #222;
            border: 2px dashed #444;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .slot.active {
            border-color: #00ff00;
            background-color: #1a2f1a;
        }

        #dialogue-panel {
            flex: 1;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #dialogue-text {
            font-size: 16px;
            color: #00ff00; /* Verde Fernan */
            line-height: 1.4;
        }

        /* Puerta del Laberinto */
        .door {
            width: 80px;
            height: 160px;
            background-color: #5c3a21;
            position: absolute;
            bottom: 20px;
            left: 400px;
            border: 4px solid #2e1c0c;
        }

    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- PANTALLA DE MENU -->
        <div id="menu-screen" class="screen active">
            <div class="title-saw">FERNAN FLOO</div>
            <div class="title-fernan">SAW GAME CLONE</div>
            <button class="btn-custom" onclick="startGame()">JUGAR</button>
        </div>

        <!-- PANTALLA PRINCIPAL DEL JUEGO -->
        <div id="game-screen" class="screen">
            
            <!-- HABITACIÓN 1 -->
            <div id="room1" class="room active">
                <!-- Puerta cerrada bloqueando el paso -->
                <div class="interactive door" onclick="interactDoor()"></div>
                <!-- Llave tirada en el suelo -->
                <div id="game-key" class="interactive item-key" onclick="pickKey()"></div>
                
                <!-- Flecha para ir a la derecha -->
                <div class="arrow arrow-right" onclick="changeRoom('room2')">➔</div>
            </div>

            <!-- HABITACIÓN 2 (PIGSAW) -->
            <div id="room2" class="room">
                <!-- Pigsaw en su triciclo / parado -->
                <div class="interactive pigsaw" onclick="talkToPigsaw()"></div>
                
                <!-- Flecha para regresar a la izquierda -->
                <div class="arrow arrow-left" onclick="changeRoom('room1')">Layout ➔</div>
            </div>

            <!-- AVATAR DE FERNANFLOO (PERSISTENTE EN LA ESCENA) -->
            <div id="fernan-player"></div>

            <!-- BARRA DE INTERFAZ INFERIOR -->
            <div id="ui-bar">
                <!-- Panel de Objetos -->
                <div id="inventory-panel">
                    <div class="inventory-title">Inventario</div>
                    <div class="inventory-slots">
                        <div id="slot1" class="slot" onclick="selectItem('Llave Oxidada')"></div>
                        <div class="slot"></div>
                        <div class="slot"></div>
                        <div class="slot"></div>
                    </div>
                </div>
                <!-- Panel de Texto de Diálogo -->
                <div id="dialogue-panel">
                    <div id="dialogue-text">Pigsaw te ha atrapado... Busca una forma de escapar.</div>
                </div>
            </div>

        </div>
    </div>

    <!-- ==========================================================================
       LÓGICA DEL JUEGO (JAVASCRIPT) - Motor de Aventura Gráfica
       ========================================================================== */ -->
    <script>
        // Estado del Juego Global
        let gameState = {
            hasKey: false,
            doorUnlocked: false,
            selectedItem: null,
            currentRoom: 'room1'
        };

        // Iniciar el Juego
        function startGame() {
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            showDialogue("Fernan: ¡Oh no! ¿Dónde estoy? Ese muñeco feo me durmió... ¡Tengo que escapar, carajo!");
        }

        // Sistema de Diálogos Dinámicos
        function showDialogue(text, color = "#00ff00") {
            const dialogueText = document.getElementById('dialogue-text');
            dialogueText.style.color = color;
            dialogueText.innerText = text;
        }

        // Navegación entre habitaciones estilo Point and Click
        function changeRoom(roomId) {
            document.querySelectorAll('.room').forEach(room => room.classList.remove('active'));
            document.getElementById(roomId).classList.add('active');
            gameState.currentRoom = roomId;

            // Mover a Fernan al lado correspondiente de manera elegante
            const fernan = document.getElementById('fernan-player');
            if(roomId === 'room2') {
                fernan.style.left = "60px";
                showDialogue("Fernan: Mira quién está ahí... el payaso de Saw.");
            } else {
                fernan.style.left = "100px";
            }
        }

        // Mecánica: Recoger Objeto
        function pickKey() {
            gameState.hasKey = true;
            document.getElementById('game-key').style.display = 'none';
            
            // Renderizar en el inventario de forma visual
            const slot1 = document.getElementById('slot1');
            slot1.innerHTML = `<div style="width:30px; height:15px; background:#ffd700; border-radius:3px;"></div>`;
            
            showDialogue("Fernan: ¡Encontré una llave vieja! Seguro abre algo por aquí.");
        }

        // Mecánica: Seleccionar objeto del inventario
        function selectItem(item) {
            if (item === 'Llave Oxidada' && gameState.hasKey) {
                gameState.selectedItem = item;
                document.getElementById('slot1').classList.add('active');
                showDialogue("Sistema: Has seleccionado 'Llave Oxidada'. Úsala en la puerta.");
            }
        }

        // Mecánica: Interactuar con la Puerta
        function interactDoor() {
            if (gameState.doorUnlocked) {
                showDialogue("Fernan: ¡Ya está abierta! ¡He escapado! ¡GANASTE CRACK!");
                setTimeout(() => {
                    alert("¡Felicidades! Lograste superar la primera fase del Fernan Saw Game.");
                    location.reload();
                }, 1000);
            } else if (gameState.selectedItem === 'Llave Oxidada') {
                gameState.doorUnlocked = true;
                gameState.selectedItem = null;
                document.getElementById('slot1').classList.remove('active');
                document.getElementById('slot1').innerHTML = ''; // Quitar del inventario
                showDialogue("Fernan: ¡Perfecto! La llave encaja perfectamente. La puerta está abierta.");
            } else {
                showDialogue("Fernan: La puerta está trancada con un candado muy fuerte. Necesito algo.");
            }
        }

        // Mecánica: Hablar con el Antagonista (Pigsaw)
        function talkToPigsaw() {
            showDialogue("Pigsaw: Hola Fernanfloo. Quiero jugar un juego... Tu preciado botón de YouTube está tras esa puerta.", "#ff0000");
        }
    </script>
</body>
</html>
