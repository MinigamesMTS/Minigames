<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Clon Profesional HTML5</title>
    <style>
        /* ==========================================================================
           ESTILOS (INTERFAZ Y CONTENEDOR)
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial Black', sans-serif; user-select: none; }
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; }
        
        #game-wrapper {
            position: relative;
            width: 800px;
            height: 400px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border: 4px solid #222;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Pantallas de Interfaz */
        .ui-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(3px); z-index: 10; display: none;
        }
        .ui-screen.active { display: flex; }

        h1 { font-size: 50px; text-transform: uppercase; margin-bottom: 10px; text-shadow: 4px 4px 0 #000; letter-spacing: 2px; }
        h1 span { color: #00ffcc; }

        .btn {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            border: 3px solid #1B5E20; color: white; padding: 15px 40px; font-size: 24px;
            cursor: pointer; border-radius: 8px; margin: 10px; text-transform: uppercase;
            box-shadow: 0 6px 0 #1B5E20; transition: all 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1B5E20; }
        
        .level-btns { display: flex; gap: 15px; margin-top: 20px; }
        .btn-stereo { background: #1e90ff; border-color: #00008b; box-shadow: 0 6px 0 #00008b; }
        .btn-deadlocked { background: #8a2be2; border-color: #4b0082; box-shadow: 0 6px 0 #4b0082; }
        .btn-bloodbath { background: #ff0000; border-color: #8b0000; box-shadow: 0 6px 0 #8b0000; }
        
        #attempt-counter { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; z-index: 5; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="attempt-counter">INTENTO 1</div>

        <!-- MENU PRINCIPAL -->
        <div id="menuScreen" class="ui-screen active">
            <h1>GEOMETRY <span>CLONE</span></h1>
            <p>Haz clic o presiona ESPACIO para saltar</p>
            <div class="level-btns">
                <button class="btn btn-stereo" onclick="startGame('stereo')">STEREO MADNESS</button>
                <button class="btn btn-deadlocked" onclick="startGame('deadlocked')">DEADLOCKED</button>
                <button class="btn btn-bloodbath" onclick="startGame('bloodbath')">BLOODBATH</button>
            </div>
        </div>

        <!-- PANTALLA DE MUERTE -->
        <div id="deathScreen" class="ui-screen">
            <h1 style="color: #ff3333;">DESTRUIDO</h1>
            <button class="btn" onclick="retryLevel()">REINTENTAR</button>
            <button class="btn" style="background:#555; border-color:#222; box-shadow: 0 6px 0 #222;" onclick="showMenu()">MENÚ</button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           MOTOR DEL JUEGO HTML5 CANVAS (JAVASCRIPT PRO)
           ========================================================================== */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Estado del Juego
        let gameState = 'menu'; // menu, playing, dead
        let currentLevelKey = '';
        let attempt = 1;
        let animationId;

        // Físicas Globales
        const GRAVITY = 1.2;
        const JUMP_FORCE = -14.5;
        const GROUND_Y = 320; // Dónde está el suelo

        // Definición de Niveles
        const levels = {
            stereo: { speed: 6, bgColor: '#0055ff', groundColor: '#0033aa', cubeColor: '#ffff00', map: [
                { type: 'spike', x: 600 }, { type: 'spike', x: 1000 }, { type: 'spike', x: 1040 },
                { type: 'block', x: 1400, y: 280, w: 40, h: 40 }, { type: 'spike', x: 1600 },
                { type: 'block', x: 2000, y: 280, w: 120, h: 40 }, { type: 'spike', x: 2040, y: 240 } // Spike on block
            ]},
            deadlocked: { speed: 9, bgColor: '#2d004d', groundColor: '#1a0033', cubeColor: '#00ffcc', map: [
                { type: 'spike', x: 500 }, { type: 'spike', x: 540 }, { type: 'spike', x: 800 },
                { type: 'block', x: 1100, y: 280, w: 40, h: 40 }, { type: 'block', x: 1250, y: 240, w: 40, h: 40 },
                { type: 'spike', x: 1500 }, { type: 'spike', x: 1540 }, { type: 'spike', x: 1580 }
            ]},
            bloodbath: { speed: 12, bgColor: '#4d0000', groundColor: '#260000', cubeColor: '#ff0000', map: [
                { type: 'spike', x: 400 }, { type: 'spike', x: 440 }, { type: 'spike', x: 480 },
                { type: 'spike', x: 700 }, { type: 'block', x: 900, y: 280, w: 40, h: 40 }, 
                { type: 'spike', x: 900, y: 240 }, { type: 'spike', x: 1100 }, { type: 'spike', x: 1140 }, { type: 'spike', x: 1180 }
            ]}
        };

        let currentLevel = null;
        let obstacles = [];
        let particles = [];
        let distance = 0;

        // Entidad Jugador (El Cubo)
        const player = {
            x: 100, y: GROUND_Y - 40, size: 40, dy: 0,
            rotation: 0, grounded: true, isDead: false
        };

        // Inputs
        let isJumping = false;
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') handleJumpInput();
        });
        window.addEventListener('mousedown', handleJumpInput);
        window.addEventListener('touchstart', handleJumpInput);

        function handleJumpInput() {
            if (gameState === 'playing' && player.grounded && !player.isDead) {
                player.dy = JUMP_FORCE;
                player.grounded = false;
            } else if (gameState === 'dead') {
                retryLevel();
            }
        }

        // --- SISTEMA DE PARTÍCULAS (Rastro del cubo) ---
        function createTrail() {
            if(!player.grounded || player.isDead) return;
            particles.push({
                x: player.x - 5, y: player.y + player.size,
                size: Math.random() * 8 + 4,
                life: 1, color: currentLevel.cubeColor
            });
        }
        function updateParticles() {
            for(let i = particles.length -1; i >= 0; i--) {
                let p = particles[i];
                p.x -= currentLevel.speed; // Mover con el mundo
                p.life -= 0.05;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }
        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y - p.size, p.size, p.size);
            });
            ctx.globalAlpha = 1.0; // Reset
        }

        // --- LÓGICA DEL JUEGO ---
        function startGame(levelKey) {
            currentLevelKey = levelKey;
            attempt = 1;
            document.getElementById('menuScreen').classList.remove('active');
            initLevel();
        }

        function retryLevel() {
            attempt++;
            document.getElementById('deathScreen').classList.remove('active');
            initLevel();
        }

        function showMenu() {
            gameState = 'menu';
            document.getElementById('deathScreen').classList.remove('active');
            document.getElementById('menuScreen').classList.active = 'active';
            cancelAnimationFrame(animationId);
        }

        function initLevel() {
            currentLevel = levels[currentLevelKey];
            gameState = 'playing';
            player.y = GROUND_Y - player.size;
            player.dy = 0;
            player.rotation = 0;
            player.isDead = false;
            player.grounded = true;
            distance = 0;
            particles = [];
            
            // Clonar mapa profundo
            obstacles = JSON.parse(JSON.stringify(currentLevel.map));
            document.getElementById('attempt-counter').innerText = `INTENTO ${attempt}`;
            
            if(animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function die() {
            player.isDead = true;
            gameState = 'dead';
            document.getElementById('deathScreen').classList.add('active');
            // Efecto de explosión de partículas
            for(let i=0; i<20; i++) {
                particles.push({
                    x: player.x + 20, y: player.y + 20, size: Math.random()*10+5,
                    life: 1, color: currentLevel.cubeColor,
                    dx: (Math.random()-0.5)*15, dy: (Math.random()-0.5)*15
                });
            }
        }

        // Detección de Colisiones (Hitboxes profesionales)
        function checkCollisions() {
            // Hitbox del jugador ligeramente más pequeña para hacerlo justo
            const pBox = { x: player.x + 4, y: player.y + 4, w: player.size - 8, h: player.size - 8 };

            player.grounded = false; // Asumir en el aire a menos que colisione con suelo/bloque

            for (let obs of obstacles) {
                let ox = obs.x - distance;
                let oy = obs.y !== undefined ? obs.y : GROUND_Y - 40;
                let ow = obs.type === 'block' ? obs.w : 40;
                let oh = obs.type === 'block' ? obs.h : 40;

                // Solo verificar obstáculos en pantalla
                if (ox > 800 || ox + ow < 0) continue;

                if (obs.type === 'spike') {
                    // Hitbox triangular simple pero justa
                    let hitboxDist = 12;
                    if (pBox.x < ox + ow - hitboxDist && pBox.x + pBox.w > ox + hitboxDist &&
                        pBox.y < oy + oh && pBox.y + pBox.h > oy + hitboxDist) {
                        die(); return;
                    }
                } else if (obs.type === 'block') {
                    // Colisión con bloque sólido
                    if (pBox.x < ox + ow && pBox.x + pBox.w > ox && pBox.y < oy + oh && pBox.y + pBox.h > oy) {
                        // ¿Chocó por arriba (Aterrizó) o por un lado (Muerte)?
                        if (player.dy >= 0 && player.y + player.size - player.dy - 2 <= oy) {
                            player.y = oy - player.size;
                            player.dy = 0;
                            player.grounded = true;
                            // Alinear rotación a múltiplo de 90
                            player.rotation = Math.round(player.rotation / 90) * 90;
                        } else {
                            // Chocó por el lado izquierdo del bloque
                            die(); return;
                        }
                    }
                }
            }

            // Suelo Base
            if (player.y >= GROUND_Y - player.size) {
                player.y = GROUND_Y - player.size;
                player.dy = 0;
                player.grounded = true;
                player.rotation = Math.round(player.rotation / 90) * 90;
            }
        }

        function update() {
            if (player.isDead) {
                // Actualizar explosión
                particles.forEach(p => { p.x += p.dx || 0; p.y += p.dy || 0; p.life -= 0.02; });
                return;
            }

            // Físicas del Jugador
            player.dy += GRAVITY;
            player.y += player.dy;

            // Mover el Mundo
            distance += currentLevel.speed;

            // Rotación al saltar
            if (!player.grounded) {
                player.rotation += 8; // Velocidad de giro
            }

            if(distance % 10 < currentLevel.speed) createTrail();
            updateParticles();
            checkCollisions();
        }

        function draw() {
            // Fondo
            ctx.fillStyle = currentLevel ? currentLevel.bgColor : '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (currentLevel) {
                // Suelo inferior
                ctx.fillStyle = currentLevel.groundColor;
                ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
                // Línea del suelo superior
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, GROUND_Y, canvas.width, 3);
            }

            drawParticles();

            // Dibujar Obstáculos
            obstacles.forEach(obs => {
                let ox = obs.x - distance;
                if (ox > 800 || ox < -100) return; // Fuera de pantalla

                if (obs.type === 'spike') {
                    let oy = obs.y !== undefined ? obs.y : GROUND_Y - 40;
                    ctx.fillStyle = '#ffffff'; // Interior del pincho
                    ctx.beginPath();
                    ctx.moveTo(ox + 20, oy); // Punta
                    ctx.lineTo(ox + 40, oy + 40); // Derecha
                    ctx.lineTo(ox, oy + 40); // Izquierda
                    ctx.closePath();
                    ctx.fill();
                    // Borde negro del pincho
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#000';
                    ctx.stroke();
                } else if (obs.type === 'block') {
                    let oy = obs.y !== undefined ? obs.y : GROUND_Y - obs.h;
                    ctx.fillStyle = '#333333'; // Centro bloque
                    ctx.fillRect(ox, oy, obs.w, obs.h);
                    ctx.lineWidth = 3; // Borde bloque
                    ctx.strokeStyle = '#ffffff';
                    ctx.strokeRect(ox, oy, obs.w, obs.h);
                }
            });

            // Dibujar Jugador (Cubo)
            if (!player.isDead) {
                ctx.save();
                ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
                ctx.rotate(player.rotation * Math.PI / 180);
                
                // Color interior
                ctx.fillStyle = currentLevel.cubeColor;
                ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                
                // Borde del cubo
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
                
                // Cara/Ojo del cubo (Detalle Pro)
                ctx.fillStyle = '#000';
                ctx.fillRect(-player.size/4, -player.size/4, player.size/4, player.size/4);

                ctx.restore();
            }
        }

        function gameLoop() {
            if (gameState !== 'menu') {
                update();
                draw();
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        // Dibujo Inicial de Fondo para el menú
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

    </script>
</body>
</html>
