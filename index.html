<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juegos Hermanos</title>

  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      background-color: #111;
      padding: 25px;
      font-size: 32px;
      font-weight: bold;
    }

    .contenedor {
      padding: 30px;
    }

    .juego {
      background-color: #1a1a1a;
      margin: 30px auto;
      padding: 20px;
      max-width: 800px;
      border-radius: 12px;
    }

    iframe {
      width: 100%;
      height: 360px;
      border: none;
      border-radius: 10px;
    }

    

    footer {
      background-color: #111;
      padding: 15px;
      margin-top: 40px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>🎮 Juegos Gratis</header>

<div class="contenedor">

  <div class="juego">
    <h2>Hollow Knight</h2>

    <iframe 
      src="https://www.youtube.com/watch?v=UAO2urG23S4"
      allowfullscreen>
    </iframe>
    
    <meta charset="UTF-8">
    <title>LINKS</title>
    <style>
        .link-rojo {
            color: red;
            font-size: 18px;
            text-decoration: none;
        }

        .link-rojo:hover {
            text-decoration: underline;
        }

        .link-azul {
            color: blue;
            font-size: 18px;
            text-decoration: none;
        }

        .link-azul:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <a href="https://github.com/usuario1/repositorio1" 
       class="link-rojo" 
       target="_blank">
       Mega
    </a>

    <br><br>

    <a href="https://github.com/usuario2/repositorio2" 
       class="link-azul" 
       target="_blank">
       Mediafire
    </a>

</body>
</html>
